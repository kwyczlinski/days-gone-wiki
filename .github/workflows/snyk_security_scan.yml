name: Snyk Security Scan

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 0 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --- Layer 1: Python at backend ---
      - name: Run Snyk Python scan
        uses: snyk/actions/python@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: test
          sarif: true
          args: --file=backend/requirements.txt --package-manager=pip
  
      - name: Rename Python SARIF
        run: if [ -f snyk.sarif ]; then mv snyk.sarif snyk-python.sarif; fi

      # --- Layer 2: Node.js at frontend ---
      - name: Run Snyk Node.js scan
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: test
          sarif: true
          args: --file=frontend/package.json

      - name: Rename Node SARIF
        run: if [ -f snyk.sarif ]; then mv snyk.sarif snyk-node.sarif; fi

      # --- Layer 3: IaC at docker compose ---
      - name: Run Snyk IaC scan
        uses: snyk/actions/iac@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: test
          sarif: true
          args: docker-compose.yml

      - name: Rename IaC SARIF
        run: if [ -f snyk.sarif ]; then mv snyk.sarif snyk-iac.sarif; fi

      # --- Upload results to GitHub Security tab ---
      - name: Upload Python SARIF
        if: hashFiles('snyk-python.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: snyk-python.sarif
          category: snyk-python

      - name: Upload Node SARIF
        if: hashFiles('snyk-node.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: snyk-node.sarif
          category: snyk-node

      - name: Upload IaC SARIF
        if: hashFiles('snyk-iac.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: snyk-iac.sarif
          category: snyk-iac
