name: Security Scan

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 0 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  dependency-and-iac-scan:
    runs-on: ubuntu-latest

    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Snyk CLI
        run: npm install -g snyk

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Snyk Node scan
        continue-on-error: true
        working-directory: ./frontend
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test --file=package.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt

      - name: Snyk Python scan
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk test --file=backend/requirements.txt --package-manager=pip --severity-threshold=high

      - name: Snyk IaC scan
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk iac test --file=docker-compose.yml # add k8s etc. later

  container-scan:
    runs-on: ubuntu-latest

    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Snyk CLI
        run: npm install -g snyk
      - name: Build Backend Image
        run: |
          docker build -t wiki-backend-security ./backend

      - name: Build Frontend Image
        run: |
          docker build -t wiki-frontend-security ./frontend

      - name: Snyk scan backend container
        continue-on-error: true
        run: |
          snyk container test wiki-backend-security

      - name: Snyk scan frontend container
        continue-on-error: true
        run: |
          snyk container test wiki-frontend-security