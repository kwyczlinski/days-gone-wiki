services:
  gateway:
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_started

  db:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"

  backend:
    environment:
      FLASK_DEBUG: "1"
      DB_HOST: db
      REDIS_HOST: redis

    command: flask run --host=0.0.0.0 --port=5000 --debug

    volumes:
      - ./backend:/app
      - ./backend/logs:/app/logs

    ports:
      - "5000:5000"

  frontend:
    volumes:
      - ./frontend:/app
      - /app/node_modules

    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

    ports:
      - "5173:5173"

  authentik-server:
    ports:
      - "9000:9000"
      - "9443:9443"