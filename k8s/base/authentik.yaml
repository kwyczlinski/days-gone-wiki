apiVersion: apps/v1
kind: Deployment
metadata:
  name: authentik-server
  namespace: wiki-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: authentik-server
  template:
    metadata:
      labels:
        app: authentik-server
    spec:
      containers:
      - name: authentik-server
        image: ghcr.io/goauthentik/server:latest
        args: ["server"]
        env:
        - name: AUTHENTIK_REDIS__HOST
          valueFrom: { configMapKeyRef: { name: wiki-config, key: AUTHENTIK_REDIS__HOST } }
        - name: AUTHENTIK_POSTGRESQL__HOST
          valueFrom: { configMapKeyRef: { name: wiki-config, key: AUTHENTIK_POSTGRESQL__HOST } }
        - name: AUTHENTIK_POSTGRESQL__USER
          valueFrom: { configMapKeyRef: { name: wiki-config, key: DB_USER } }
        - name: AUTHENTIK_POSTGRESQL__NAME
          value: "authentik"
        - name: AUTHENTIK_HOST
          valueFrom: { configMapKeyRef: { name: wiki-config, key: AUTHENTIK_HOST } }
        - name: AUTHENTIK_POSTGRESQL__PASSWORD
          valueFrom: { secretKeyRef: { name: wiki-secrets, key: DB_PASSWORD } }
        - name: AUTHENTIK_SECRET_KEY
          valueFrom: { secretKeyRef: { name: wiki-secrets, key: AUTHENTIK_SECRET_KEY } }
        resources:
          limits: { cpu: "0.75", memory: 512Mi }
          requests: { cpu: "200m", memory: 256Mi }
        ports:
        - containerPort: 9000
          name: http
        readinessProbe:
          httpGet: { path: /-/health/ready/, port: 9000 }
          initialDelaySeconds: 20
          periodSeconds: 10
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authentik-worker
  namespace: wiki-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: authentik-worker
  template:
    metadata:
      labels:
        app: authentik-worker
    spec:
      containers:
      - name: authentik-worker
        image: ghcr.io/goauthentik/server:latest
        args: ["worker"]
        env:
        - name: AUTHENTIK_REDIS__HOST
          valueFrom: { configMapKeyRef: { name: wiki-config, key: AUTHENTIK_REDIS__HOST } }
        - name: AUTHENTIK_POSTGRESQL__HOST
          valueFrom: { configMapKeyRef: { name: wiki-config, key: AUTHENTIK_POSTGRESQL__HOST } }
        - name: AUTHENTIK_POSTGRESQL__USER
          valueFrom: { configMapKeyRef: { name: wiki-config, key: DB_USER } }
        - name: AUTHENTIK_POSTGRESQL__NAME
          value: "authentik"
        - name: AUTHENTIK_HOST
          valueFrom: { configMapKeyRef: { name: wiki-config, key: AUTHENTIK_HOST } }
        - name: AUTHENTIK_POSTGRESQL__PASSWORD
          valueFrom: { secretKeyRef: { name: wiki-secrets, key: DB_PASSWORD } }
        - name: AUTHENTIK_SECRET_KEY
          valueFrom: { secretKeyRef: { name: wiki-secrets, key: AUTHENTIK_SECRET_KEY } }
        - name: AUTHENTIK_BOOTSTRAP_PASSWORD
          valueFrom: { secretKeyRef: { name: wiki-secrets, key: AUTHENTIK_BOOTSTRAP_PASSWORD } }
        resources:
          limits: { cpu: "0.5", memory: 512Mi }
        readinessProbe:
          exec:
            command: ["ak", "healthcheck"]
          initialDelaySeconds: 20
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: authentik-service
  namespace: wiki-app
spec:
  ports:
  - port: 9000
    targetPort: 9000
  selector:
    app: authentik-server