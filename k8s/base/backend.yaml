apiVersion: apps/v1
kind: Deployment
metadata:
  name: wiki-backend
  namespace: wiki-app
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: wiki-backend
  template:
    metadata:
      labels:
        app: wiki-backend
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      terminationGracePeriodSeconds: 15
      containers:
      - name: backend
        image: wiki-backend
        env:
        - name: DB_HOST
          valueFrom: { configMapKeyRef: { name: wiki-config, key: DB_HOST } }
        - name: DB_PORT
          valueFrom: { configMapKeyRef: { name: wiki-config, key: DB_PORT } }
        - name: DB_NAME
          valueFrom: { configMapKeyRef: { name: wiki-config, key: DB_NAME } }
        - name: DB_USER
          valueFrom: { configMapKeyRef: { name: wiki-config, key: DB_USER } }
        - name: REDIS_HOST
          valueFrom: { configMapKeyRef: { name: wiki-config, key: REDIS_HOST } }
        - name: AUTHENTIK_ISSUER
          valueFrom: { configMapKeyRef: { name: wiki-config, key: AUTHENTIK_ISSUER } }
        - name: AUTHENTIK_PUBLIC_URL
          valueFrom: { configMapKeyRef: { name: wiki-config, key: AUTHENTIK_PUBLIC_URL } }
        - name: AUTHENTIK_CLIENT_ID
          valueFrom: { configMapKeyRef: { name: wiki-config, key: AUTHENTIK_CLIENT_ID } }
        - name: AUTHENTIK_INTERNAL_URL
          valueFrom: { configMapKeyRef: { name: wiki-config, key: AUTHENTIK_INTERNAL_URL } }
        - name: DB_PASSWORD
          valueFrom: { secretKeyRef: { name: wiki-secrets, key: DB_PASSWORD } }
        - name: JWT_KEY
          valueFrom: { secretKeyRef: { name: wiki-secrets, key: JWT_KEY } }
        - name: AUTHENTIK_CLIENT_SECRET
          valueFrom: { secretKeyRef: { name: wiki-secrets, key: AUTHENTIK_CLIENT_SECRET } }
        resources:
          limits:
            cpu: "0.75"
            memory: 256Mi
          requests:
            cpu: "200m"
            memory: 128Mi
        ports:
        - containerPort: 5000
        livenessProbe:
          httpGet: { path: /api/health, port: 5000 }
          initialDelaySeconds: 10
          periodSeconds: 5
        readinessProbe:
          httpGet: { path: /api/ready, port: 5000 }
          initialDelaySeconds: 15
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: wiki-backend-service
  namespace: wiki-app
spec:
  ports:
  - port: 5000
    targetPort: 5000
  selector:
    app: wiki-backend
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: wiki-backend-pdb
  namespace: wiki-app
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: wiki-backend