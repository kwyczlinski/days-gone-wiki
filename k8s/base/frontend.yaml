apiVersion: apps/v1
kind: Deployment
metadata:
  name: wiki-frontend
  namespace: wiki-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: wiki-frontend
  template:
    metadata:
      labels:
        app: wiki-frontend
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
      - name: frontend
        image: wiki-frontend
        resources:
          limits:
            cpu: "0.5"
            memory: 128Mi
          requests:
            cpu: "100m"
            memory: 64Mi
        ports:
        - containerPort: 8080
        env:
        - name: VITE_API_URL
          valueFrom:
            configMapKeyRef:
              name: wiki-config
              key: VITE_API_URL
        - name: VITE_AUTHENTIK_PUBLIC_URL
          valueFrom:
            configMapKeyRef:
              name: wiki-config
              key: AUTHENTIK_PUBLIC_URL
        - name: VITE_AUTHENTIK_CLIENT_ID
          valueFrom:
            configMapKeyRef:
              name: wiki-config
              key: AUTHENTIK_CLIENT_ID
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: wiki-frontend-service
  namespace: wiki-app
spec:
  ports:
  - port: 8080
  selector:
    app: wiki-frontend