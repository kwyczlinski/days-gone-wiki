apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wiki-ingress
  namespace: wiki-app
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - wiki.local
    - auth.local
    secretName: wiki-tls-secret
  rules:
  - host: wiki.local
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: wiki-backend-service
            port:
              number: 5000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: wiki-frontend-service
            port:
              number: 8080
  - host: auth.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: authentik-service
            port:
              number: 9000