apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  - target:
      kind: Deployment
      name: wiki-backend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: wiki-frontend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1

images:
  - name: wiki-backend
    newName: ghcr.io/kwyczlinski/wiki-backend
    newTag: latest
  - name: wiki-frontend
    newName: ghcr.io/kwyczlinski/wiki-frontend
    newTag: latest