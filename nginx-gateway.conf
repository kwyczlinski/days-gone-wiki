server {
    listen 80;
    server_name wiki.local auth.local;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name wiki.local;

    ssl_certificate     /etc/nginx/certs/wiki.local+1.pem;
    ssl_certificate_key /etc/nginx/certs/wiki.local+1-key.pem;

    client_max_body_size 50M;

    location /api/ {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://frontend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    server_name auth.local;

    ssl_certificate     /etc/nginx/certs/wiki.local+1.pem;
    ssl_certificate_key /etc/nginx/certs/wiki.local+1-key.pem;

    location / {
        proxy_pass http://authentik-server:9000;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}