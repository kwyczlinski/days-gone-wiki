services:
  db:
    image: postgres:latest
    platform: linux/amd64
    container_name: wiki-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./db:/docker-entrypoint-initdb.d
    networks:
      - wiki-network

  backend:
    build: ./backend
    platform: linux/amd64
    container_name: wiki-api
    env_file: .env
    ports:
      - "5000:5000"
    environment:
      - DB_HOST=db
    depends_on:
      - db
    volumes:
      - ./backend:/app
      - ./backend/logs:/app/logs
      - /app/__pycache__
      - ./certs:/app/certs:ro
    networks:
      - wiki-network

  frontend:
    build: ./frontend
    platform: linux/amd64
    container_name: wiki-ui
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=https://192.168.1.97:5000
    stdin_open: true
    tty: true
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - ./certs:/app/certs:ro
    networks:
      - wiki-network

networks:
  wiki-network:
    driver: bridge
